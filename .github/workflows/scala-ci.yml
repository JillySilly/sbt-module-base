name: Scala Distributed Engine Pipeline

on:
  schedule:
    # Wakes up at 23 minutes past 0 AM, 6 AM, 12 PM, and 6 PM UTC
    # (8:23 AM, 2:23 PM, 8:23 PM, and 2:23 AM Singapore Time)
    - cron: '23 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  scala-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Core Repository
        uses: actions/checkout@v4

      - name: Mutate Scala Case Class Spec
        run: |
          # 30% chance to skip (maintains natural execution gaps)
          if [ $((RANDOM % 100)) -lt 30 ]; then
            echo "Scala pipeline specs current. Skipping execution."
            exit 0
          fi

          mkdir -p src/main/scala/com/engine/model
          TARGET_FILE="src/main/scala/com/engine/model/PipelineData.scala"

          if [ ! -f "$TARGET_FILE" ]; then
            echo "package com.engine.model" > "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
            echo "// Core Distributed Pipeline Data Models" >> "$TARGET_FILE"
          fi

          COMPONENTS=("TelemetryEvent" "BufferChunk" "StateRecord" "MetricNode" "ClusterVector")
          PICKED_COMP=${COMPONENTS[$RANDOM % ${#COMPONENTS[@]}]}

          echo "" >> "$TARGET_FILE"
          echo "/** Pipeline node state representation $RANDOM */" >> "$TARGET_FILE"
          echo "final case class ${PICKED_COMP}_$RANDOM(" >> "$TARGET_FILE"
          echo "  nodeId: Long = ${RANDOM}L," >> "$TARGET_FILE"
          echo "  active: Boolean = true" >> "$TARGET_FILE"
          echo ")" >> "$TARGET_FILE"

          git config --global user.name "JillySilly"
          git config --global user.email "ranaebaddiefb@gmail.com"

          MESSAGES=(
            "feat: add Scala case class model for distributed stream event"
            "refactor: optimize case class field definitions in PipelineData"
            "fix: adjust default parameter bounds on Scala data models"
            "chore: sync sbt module dataset schema definitions"
          )
          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          git add src/
          git commit -m "$MSG"
          git push
